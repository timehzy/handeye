name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (orchestrator / device-kmp / conformance)
        run: ./gradlew :orchestrator:test :device-kmp:testDebugUnitTest :conformance:test --console=plain

      - name: Assemble debug variants
        run: ./gradlew :demo-android:app:assembleDebug :device-android:assemble --console=plain
